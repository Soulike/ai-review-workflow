name: AI review workflow

on:
  workflow_call:
    inputs:
      review-prompt-path:
        description: Optional Markdown review criteria from the exact event base.
        type: string
        required: false
        default: ""
      model:
        description: Copilot model selection.
        type: string
        required: false
        default: auto
      reasoning-effort:
        description: Required concrete supported Copilot reasoning effort.
        type: string
        required: true
      network_allowed:
        description: Additional allowed network domains or gh-aw ecosystems, comma-separated.
        type: string
        required: false
        default: ""
    secrets:
      DEEPSEEK_API_KEY:
        required: false
      TAVILY_API_KEY:
        required: false

permissions: {}

jobs:
  select_search_mcp:
    name: Select search MCP
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mcp: ${{ steps.select.outputs.mcp }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Select search MCP backend
        id: select
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node scripts/select-search-mcp.ts

  engine_deepseek_web:
    name: Engine (DeepSeek Web MCP)
    needs: [select_search_mcp]
    if: needs.select_search_mcp.outputs.mcp == 'deepseek-web'
    permissions:
      actions: read
      checks: read
      contents: read
      discussions: read
      issues: write
      pull-requests: write
      security-events: read
      statuses: read
      vulnerability-alerts: read
      copilot-requests: write
    uses: ./.github/workflows/review-deepseek-web-mcp.lock.yml
    with:
      review-prompt-path: ${{ inputs.review-prompt-path }}
      model: ${{ inputs.model }}
      reasoning-effort: ${{ inputs.reasoning-effort }}
      network_allowed: ${{ inputs.network_allowed }}
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

  engine_tavily:
    name: Engine (Tavily MCP)
    needs: [select_search_mcp]
    if: needs.select_search_mcp.outputs.mcp == 'tavily'
    permissions:
      actions: read
      checks: read
      contents: read
      discussions: read
      issues: write
      pull-requests: write
      security-events: read
      statuses: read
      vulnerability-alerts: read
      copilot-requests: write
    uses: ./.github/workflows/review-tavily-mcp.lock.yml
    with:
      review-prompt-path: ${{ inputs.review-prompt-path }}
      model: ${{ inputs.model }}
      reasoning-effort: ${{ inputs.reasoning-effort }}
      network_allowed: ${{ inputs.network_allowed }}
    secrets:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

  ai_review_gate:
    name: AI review gate
    if: always()
    needs: [select_search_mcp, engine_deepseek_web, engine_tavily]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Require completed Engine
        env:
          AI_REVIEW_SELECT_RESULT: ${{ needs.select_search_mcp.result }}
          AI_REVIEW_SELECTED_MCP: ${{ needs.select_search_mcp.outputs.mcp }}
          AI_REVIEW_DEEPSEEK_ENGINE_RESULT: ${{ needs.engine_deepseek_web.result }}
          AI_REVIEW_TAVILY_ENGINE_RESULT: ${{ needs.engine_tavily.result }}
        run: node scripts/engine-gate.ts
