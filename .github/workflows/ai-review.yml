name: AI review workflow

on:
  workflow_call:
    inputs:
      review-prompt-path:
        description: Optional Markdown review criteria from the exact event base.
        type: string
        required: false
        default: ""
      model:
        description: Copilot model selection.
        type: string
        required: false
        default: auto
      reasoning-effort:
        description: Required concrete supported Copilot reasoning effort.
        type: string
        required: true
      network_allowed:
        description: Additional allowed network domains or gh-aw ecosystems, comma-separated.
        type: string
        required: false
        default: ""
    secrets:
      TAVILY_API_KEY:
        required: true

permissions: {}

jobs:
  engine:
    name: Engine
    permissions:
      actions: read
      checks: read
      contents: read
      discussions: read
      issues: write
      pull-requests: write
      security-events: read
      statuses: read
      vulnerability-alerts: read
      copilot-requests: write
    uses: ./.github/workflows/review.lock.yml
    with:
      review-prompt-path: ${{ inputs.review-prompt-path }}
      model: ${{ inputs.model }}
      reasoning-effort: ${{ inputs.reasoning-effort }}
      network_allowed: ${{ inputs.network_allowed }}
    secrets:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

  ai_review_gate:
    name: AI review gate
    if: always()
    needs: [engine]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require completed Engine
        env:
          ENGINE_RESULT: ${{ needs.engine.result }}
        run: |
          if [ "$ENGINE_RESULT" != success ]; then
            printf 'Engine did not succeed (%s).\n' "${ENGINE_RESULT:-missing}" >&2
            exit 1
          fi
